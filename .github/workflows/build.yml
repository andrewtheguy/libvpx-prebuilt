name: Build libvpx

# Build every archive and test it. This workflow never publishes — releasing is release.yml,
# which calls this one and then does the publishing part. Two triggers instead of one, so that
# "does it build and pass" can be asked at any time without anybody being committed to a release
# by asking.
#
# `workflow_dispatch` is the test loop and the bootstrap: the very first run of this repository's
# pipeline has to be this workflow, because nothing can be downloaded from a release that does
# not exist yet.
#
# `workflow_call` is release.yml and ci.yml. A failure anywhere in here — a build, the link test,
# the e2e binary, `check-static.sh`, the reproducibility check — fails the caller's job, and for
# release.yml that means the release never happens.
on:
  workflow_dispatch:
    inputs:
      targets:
        description: "which targets to build and test"
        type: choice
        default: all
        options: [all, x86_64, arm64]
  workflow_call:
    inputs:
      targets:
        description: "which targets to build and test"
        type: string
        default: all

# Read-only. The token that can create a release belongs to the job that creates one, and that
# job is in the other file.
permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.matrix.outputs.targets }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - uses: actions/checkout@v5

      # That the committed headers are the pinned libvpx's, and that src/bindings.rs is what
      # those headers say. Cheap, and it runs before three compilers do.
      #
      # bindgen is installed rather than assumed: `--check` regenerates, and it refuses to run
      # under a version other than the one the committed file was made with, because bindgen's
      # output is not stable across its own releases.
      - name: Install the pinned bindgen
        run: |
          sudo apt-get update && sudo apt-get install -y libclang-dev
          cargo install bindgen-cli --version 0.72.1 --locked
      - run: ./sync-prebuilt.sh --check

      # The matrix, narrowed here as *data* rather than by a job-level `if`. Two reasons, one
      # hard and one practical: a job-level condition cannot reference `matrix` at all — GitHub
      # rejects the workflow outright — and filtering before the fan-out means a
      # `targets: x86_64` dispatch starts one runner instead of three.
      - id: matrix
        env:
          GROUP: ${{ inputs.targets || 'all' }}
        run: |
          all='[
            {"target":"macos-arm64",   "runs-on":"macos-latest",    "group":"arm64"},
            {"target":"linux-x86_64",  "runs-on":"ubuntu-24.04",    "group":"x86_64"},
            {"target":"linux-aarch64", "runs-on":"ubuntu-24.04-arm","group":"arm64"}
          ]'
          targets="$(jq -c --arg g "$GROUP" '[.[] | select($g == "all" or .group == $g)]' <<<"$all")"
          echo "$targets" | jq -r '.[].target' | sed 's/^/  /'
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "count=$(jq 'length' <<<"$targets")" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      # No fail-fast: one target failing to configure is exactly the case where the other two
      # logs are the useful comparison.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.targets) }}
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v5

      # The one system package this repository needs anywhere, and only on the *builder*:
      # libvpx's x86_64 SIMD goes through an external assembler, and without one libvpx falls
      # back to C rather than failing — which is why build.sh refuses to start without it and
      # then asserts the AVX2 kernels are in the finished archive. Nothing a *consumer* does
      # needs this, which is the whole point of the repository.
      - name: Install nasm
        if: matrix.target == 'linux-x86_64'
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Build ${{ matrix.target }}
        run: ./build.sh ${{ matrix.target }}

      # The half of the artifact the archive alone does not cover: whether Rust can *link* it.
      # That is what breaks in practice — an `.a` for the wrong ABI, a missing libm, a symbol
      # under a name nobody expected — and none of it shows up in a successful make.
      # `--offline`, after sync-prebuilt.sh, also demonstrates the claim consumers care about:
      # once the archive exists, no build needs a network.
      - name: Link against it
        run: |
          ./sync-prebuilt.sh
          cargo build --offline --release --workspace

      # Here rather than in ci.yml's cheap-checks job, because every crate in this workspace
      # links the archive and clippy cannot run until one exists.
      - name: clippy
        run: cargo clippy --offline --release --all-targets -- -D warnings

      # The end-to-end leg: a release binary that is a *consumer* of the crate, encoding and
      # decoding on the runner's own processor. This is where "the archive links" becomes "the
      # codec runs", and where a CPU floor would stop being a claim in a MANIFEST.
      - name: End to end — encode and decode in a real binary
        run: |
          ./target/release/libvpx-e2e
          ./check-static.sh target/release/libvpx-e2e

      # And that the committed headers are the ones this artifact's own `make install`
      # produced — the membership half of the chain, which needs a built target to check and so
      # cannot run in `plan`.
      - name: The committed headers are the installed set
        if: matrix.target == 'linux-x86_64'
        run: |
          sudo apt-get install -y libclang-dev
          cargo install bindgen-cli --version 0.72.1 --locked
          ./sync-prebuilt.sh --check

      - name: Show what was built
        run: cat dist/${{ matrix.target }}/MANIFEST

      - uses: actions/upload-artifact@v4
        with:
          name: libvpx-${{ matrix.target }}
          path: dist/${{ matrix.target }}
          if-no-files-found: error

  # Does the same source, built twice on the same image, produce the same library?
  #
  # linux-x86_64 only, and that is a measurement rather than laziness. libvpx compiles no
  # `__DATE__`, so there is nothing to substitute with `SOURCE_DATE_EPOCH`; what is left is the
  # `ar` container, whose member mtimes and uids GNU ar can be told to zero (`-D`, which
  # build.sh passes on Linux) and Apple's ar cannot. So macOS archives differ between builds by
  # design and this job would fail on them for a reason that is not a defect.
  #
  # What it protects is the `sha256(library)` line in every MANIFEST: it is the only checksum in
  # this repository that is meant to be comparable *between releases*, and a build that is not
  # reproducible makes it comparable to nothing.
  reproducible:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.targets).*.target, 'linux-x86_64')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Build it twice and compare the library
        run: |
          ./build.sh linux-x86_64 >/dev/null
          first="$(sed -n 's/^sha256(library) //p' dist/linux-x86_64/MANIFEST)"
          # A different build directory is not enough — the point is a *clean* second build, so
          # nothing can be reused from the first.
          rm -rf build/linux-x86_64 dist/linux-x86_64
          ./build.sh linux-x86_64 >/dev/null
          second="$(sed -n 's/^sha256(library) //p' dist/linux-x86_64/MANIFEST)"
          echo "first  $first"
          echo "second $second"
          [ "$first" = "$second" ] || {
            echo "::error::two builds of the same source produced different libraries"
            exit 1
          }
          echo "reproducible"
