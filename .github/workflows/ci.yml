name: CI

# What runs on every push: the cheap checks that do not need an archive, and then one real
# target built and exercised end to end.
#
# The second half is `uses: ./.github/workflows/build.yml` rather than a copy of its steps. The
# thing worth checking on a push is that the pipeline still works, and a second implementation of
# it would be a thing that can pass while the pipeline does not. `targets: x86_64` keeps it to
# one runner; the other two are a `workflow_dispatch` away and are gated on every release
# regardless.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Every script in this repository is bash, and every one of them is `set -euo pipefail`
      # over paths that can contain anything. shellcheck is what makes that claim true rather
      # than intended.
      - name: shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          # `source.sh` and `libvpx.env` are sourced, not run, and shellcheck is told so by the
          # directives at the top of each. Passing every file in one invocation lets it follow
          # them.
          shellcheck build.sh sync-prebuilt.sh check-static.sh source.sh \
            crates/libvpx-prebuilt-sys/gen-bindings.sh

      - name: rustfmt
        run: cargo fmt --all --check

      # No clippy here. Every crate in this workspace links the archive, so clippy cannot run
      # until one has been built — which is what the build job below does, and where clippy
      # therefore lives.

  # The pipeline itself, on one target, including the bindings check its `plan` job runs.
  build:
    uses: ./.github/workflows/build.yml
    with:
      targets: x86_64
